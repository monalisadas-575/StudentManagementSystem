spring:
#  profiles:
#    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/my_database
    username: my_user
    password: my_password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5675
    username: guest
    password: guest
    virtual-host: /
    ssl:
      enabled: false
    eager-initializer: true
  cloud:
    stream:
      # FIX: bindings and rabbit must be indented inside stream
      bindings:
        addstudent-out-0:
          destination: dungu.my-first-exchange
          contentType: application/json
          binder: rabbit
      rabbit:
        bindings:
          addstudent-out-0:
            producer:
              declareExchange: true
              routing-key-expression: "'dungu.student.key'" # FIX: Must be wrapped in single quotes inside double quotes for a literal string expression

management:
  endpoints:
    web:
      exposure:
        include: mappings

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.saumrit.*: INFO
    com:
      saumrit:
        myspringbootwithjpa:
          service: DEBUG
          controller: INFO
          repository: DEBUG
  structured:
    format:
      console: logstash
      file: logstash

  file:
    name: "C:\\Users\\monal\\IdeaProjects\\MyLoggingFolder\\myspringbootwithjpa.log"
  logback:
    max-file-size: 10MB

library:
  book:
    issue:
      uri: "http://localhost:8086/issue/{name}/{category}"
    return:
      uri: "wdwdwd"

server.port: 8085


